[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hero-mcp-server"
version = "0.1.0"
description = "MCP Server für HERO Handwerkersoftware"
requires-python = ">=3.11"
dependencies = [
    # mcp 2.x ist ein Breaking Release (u.a. entfällt Server.list_tools) und
    # crasht diesen Low-Level-Server beim Start. Auf 1.x pinnen, bis der Code
    # auf die 2.x-API migriert ist. Verifiziert lauffähig mit 1.28.0.
    "mcp>=1.28.0,<2",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "starlette>=0.40.0",
    "uvicorn>=0.30.0",
]

[project.scripts]
hero-mcp-server = "hero_mcp_server.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hero_mcp_server"]
